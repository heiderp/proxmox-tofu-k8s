---
# Reconstruye el cluster completo sobre las VMs que crea `tofu apply`.
#
#   cd ansible/ && ansible-playbook playbooks/cluster.yml
#
# Idempotente: sobre un cluster ya montado no reinicializa nada (kubeadm init y
# join van con `creates`). Para partir de cero de verdad:
#   cd infra/ && tofu destroy -auto-approve && tofu apply -auto-approve

- name: Prerequisitos, runtime y paquetes en los tres nodos
  hosts: all
  gather_facts: true
  roles:
    - common
    - kubernetes   # antes que containerd: el assert de la sandbox_image necesita kubeadm
    - containerd

- name: Control plane
  hosts: control_plane
  gather_facts: false
  roles:
    - control_plane

- name: CNI
  hosts: control_plane
  gather_facts: false
  roles:
    - cilium
  # Antes de unir a los workers: sin CNI se unen igual, pero se quedan NotReady
  # y los pods de sistema no arrancan. Instalarlo aquí hace el orden explícito.

- name: Workers
  hosts: workers
  gather_facts: false
  roles:
    - worker

- name: Verificación final
  hosts: control_plane
  gather_facts: false
  tasks:
    - name: Estado de los nodos
      ansible.builtin.command:
        cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o wide
      register: nodes_out
      changed_when: false

    - name: Los tres nodos están Ready
      ansible.builtin.assert:
        that:
          - nodes_out.stdout_lines | select('search', ' Ready ') | list | length == 3
        fail_msg: "El cluster no tiene tres nodos Ready:\n{{ nodes_out.stdout }}"

    - name: allocatable por debajo de capacity en los tres nodos
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes
          -o jsonpath={range .items[*]}{.metadata.name}{" "}{.status.capacity.memory}{" "}{.status.allocatable.memory}{"\n"}{end}
      register: mem_out
      changed_when: false

    - name: Las reservas del kubelet están activas
      ansible.builtin.assert:
        that:
          - item.split()[1] | regex_replace('Ki$', '') | int > item.split()[2] | regex_replace('Ki$', '') | int
        fail_msg: "El nodo {{ item.split()[0] }} no tiene reservas: capacity == allocatable"
      loop: "{{ mem_out.stdout_lines | select('search', '.') | list }}"
      loop_control:
        label: "{{ item.split()[0] }}"
      # Si capacity y allocatable coinciden, las reservas no se aplicaron — y un
      # cluster de 2 GB por nodo sin reservas queda a merced del OOM killer.

    - name: Resumen
      ansible.builtin.debug:
        msg: "{{ nodes_out.stdout_lines }}"
