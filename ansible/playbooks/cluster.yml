---
# Reconstruye el cluster completo sobre las VMs que crea `tofu apply`.
#
#   cd ansible/ && ansible-playbook playbooks/cluster.yml
#
# Idempotente: sobre un cluster ya montado no reinicializa nada (kubeadm init y
# join van con `creates`). Para partir de cero de verdad:
#   cd infra/ && tofu destroy -auto-approve && tofu apply -auto-approve

- name: Prerequisitos, runtime y paquetes en los tres nodos
  hosts: all
  gather_facts: true
  roles:
    - common
    - kubernetes   # antes que containerd: el assert de la sandbox_image necesita kubeadm
    - containerd

- name: Control plane
  hosts: control_plane
  gather_facts: false
  roles:
    - control_plane

- name: CNI
  hosts: control_plane
  gather_facts: false
  roles:
    - cilium
  # Antes de unir a los workers: sin CNI se unen igual, pero se quedan NotReady
  # y los pods de sistema no arrancan. Instalarlo aquí hace el orden explícito.

- name: Workers
  hosts: workers
  gather_facts: false
  roles:
    - worker

- name: Verificación final
  hosts: control_plane
  gather_facts: false
  tasks:
    - name: Esperar a que los workers terminen de arrancar
      ansible.builtin.command:
        cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false
      # Un worker recién unido tarda unas decenas de segundos en pasar a Ready:
      # hasta que el agente de Cilium arranca en él, el nodo sigue NotReady con
      # "container runtime network not ready". Sin esta espera, la verificación
      # de abajo mide un estado transitorio.

    - name: Estado de los nodos
      ansible.builtin.command:
        cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o wide
      register: nodes_out
      changed_when: false

    - name: Los tres nodos están Ready
      ansible.builtin.assert:
        that:
          - nodes_out.stdout_lines | select('search', ' Ready ') | list | length == 3
        fail_msg: "El cluster no tiene tres nodos Ready:\n{{ nodes_out.stdout }}"

    - name: Leer capacity y allocatable de los nodos
      ansible.builtin.command:
        cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o json
      register: nodes_json
      changed_when: false

    - name: Las reservas del kubelet están activas
      ansible.builtin.assert:
        that:
          - item.status.capacity.memory | regex_replace('Ki$', '') | int >
            item.status.allocatable.memory | regex_replace('Ki$', '') | int
        fail_msg: >-
          El nodo {{ item.metadata.name }} tiene capacity == allocatable: las
          reservas del kubelet no se aplicaron.
      loop: "{{ (nodes_json.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      # Si capacity y allocatable coinciden, las reservas no se aplicaron — y un
      # cluster de 2 GB por nodo sin reservas queda a merced del OOM killer.

    - name: Resumen
      ansible.builtin.debug:
        msg: >-
          {{ item.metadata.name }}: {{ item.status.capacity.memory }} capacity,
          {{ item.status.allocatable.memory }} allocatable
      loop: "{{ (nodes_json.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"
