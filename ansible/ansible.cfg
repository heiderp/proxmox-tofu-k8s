[defaults]
inventory            = inventory.yml
roles_path           = roles
host_key_checking    = False
interpreter_python   = /usr/bin/python3
stdout_callback      = yaml
callbacks_enabled    = profile_tasks
retry_files_enabled  = False

# host_key_checking = False no es pereza: cada `tofu destroy && tofu apply` de la
# Fase 3 recrea las VMs, y con ellas las host keys de .51-.53. Con la verificación
# activa, Ansible falla con "Host key verification failed" en cada reconstrucción
# y obliga a un `ssh-keygen -R` manual — justo lo que el criterio de éxito prohíbe.

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
pipelining = True
