# El plano de datos: los recursos del proxy de Envoy que atiende el tráfico.
#
# Esto NO se configura desde el values.yaml del chart —el chart solo dimensiona el
# controlador—, sino desde este CR, que el GatewayClass referencia. Sin él, Envoy
# arranca con los valores por defecto del proyecto: pensados para un cluster de
# producción, no para 1 GB útil por worker.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: proxy-config
  namespace: gateway-system
spec:
  # Hilos de trabajo de Envoy. Por defecto usa uno por core visible (2 aquí), y cada
  # hilo lleva su propia copia de buffers y estadísticas. Con un solo Gateway y dos
  # rutas, el segundo hilo solo suma memoria.
  concurrency: 1

  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi

      envoyService:
        type: LoadBalancer
        annotations:
          # IP fija dentro del pool de MetalLB. Si se dejara elegir, un borrado y
          # recreación del Gateway podría devolver otra IP y los registros DNS de
          # Cloudflare apuntarían al vacío.
          metallb.io/loadBalancerIPs: 192.168.1.60
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # Lo que ata el recorte de recursos de arriba a todo Gateway de esta clase.
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: proxy-config
    namespace: gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    # HTTP solo existe para redirigir. La redirección en sí es un HTTPRoute aparte
    # —`redirect.yaml`—, porque Gateway API no la expresa en el listener.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Las rutas viven junto a su aplicación —`podinfo/`, `argocd/`—, no aquí.
          # Un Gateway que solo aceptara rutas de su propio namespace obligaría a
          # centralizarlas y rompería esa vecindad.
          from: All

    - name: https
      protocol: HTTPS
      port: 443
      # `hostname` acota el listener al dominio: una petición con cualquier otro
      # Host ni siquiera llega a la fase de rutas.
      hostname: "*.ph-projects.net"
      tls:
        mode: Terminate
        certificateRefs:
          # El Secret lo crea cert-manager en este mismo namespace. Si viviera en
          # otro haría falta un ReferenceGrant que lo autorizara.
          - name: wildcard-ph-projects-net-tls
      allowedRoutes:
        namespaces:
          from: All
