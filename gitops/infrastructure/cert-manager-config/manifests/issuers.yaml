# Emisores de Let's Encrypt.
#
# DNS-01 y no HTTP-01: HTTP-01 exige que Let's Encrypt alcance el puerto 80 de este
# cluster desde internet, y aquí no hay puertos abiertos en el router. Por diseño,
# no por descuido. DNS-01 solo necesita poder escribir un registro TXT en la zona.
#
# Y es lo único que permite un certificado wildcard: Let's Encrypt no emite `*.x`
# por HTTP-01 bajo ninguna circunstancia.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Staging primero, siempre. El endpoint de producción limita a 5 fallos por
    # cuenta y hora, y el primer DNS-01 rara vez sale a la primera: token con
    # permisos de menos, zona equivocada, propagación lenta. Quemar ese margen
    # depurando deja el dominio bloqueado justo cuando ya casi funciona.
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: heiderperdomo6@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: heiderperdomo6@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
