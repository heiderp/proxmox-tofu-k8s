# El token de la API de Cloudflare, cifrado con la llave pública del cluster.
#
# Esto es texto público a propósito: descifrarlo exige la llave privada, que vive
# dentro del cluster y no sale de ahí. Es lo que permite que un repo abierto
# contenga la credencial que cert-manager necesita para escribir el TXT del
# desafío DNS-01.
#
# Se generó así, sin que el valor pasara por el historial del shell:
#   kubectl create secret generic cloudflare-api-token -n cert-manager \
#     --dry-run=client --from-file=api-token=<archivo> -o yaml \
#   | kubeseal --controller-name sealed-secrets-controller \
#       --controller-namespace kube-system --format yaml
#
# El namespace es `cert-manager` y no `gateway-system`: un ClusterIssuer no tiene
# namespace, así que cert-manager busca los Secrets a los que apunta en SU propio
# namespace —el «cluster resource namespace»—. Puesto en cualquier otro sitio, el
# emisor falla diciendo que el secreto no existe.
#
# El cifrado va atado a este nombre Y a este namespace. Mover cualquiera de los dos
# lo invalida: hay que volver a sellar.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  encryptedData:
    api-token: 
  template:
    metadata:
      name: cloudflare-api-token
      namespace: cert-manager
