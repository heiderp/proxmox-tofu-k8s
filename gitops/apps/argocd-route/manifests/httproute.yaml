# La UI de ArgoCD por el Gateway.
#
# Segunda ruta, y la que demuestra que el enrutado por Host discrimina de verdad:
# dos hostnames sobre la misma IP, dos backends en namespaces distintos.
#
# Requiere `server.insecure: true` en el values.yaml de ArgoCD. Sin eso el Gateway
# habla HTTP contra un backend que exige HTTPS y la respuesta es un 502 que no
# explica nada.
#
# Queda accesible desde la LAN sin autenticación delante. Aceptable mientras no haya
# túnel; el candado real es Cloudflare Access y es el paso 7.6.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: main
      namespace: gateway-system
      # Solo al listener HTTPS. Sin `sectionName` la ruta se engancha también al
      # listener HTTP, y ahí le gana a la redirección `*.ph-projects.net` porque
      # su hostname es más específico: el resultado es un 200 en claro donde
      # debería haber un 301.
      sectionName: https
  hostnames:
    - argocd.ph-projects.net
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
