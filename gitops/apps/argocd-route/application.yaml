# La ruta HTTP de argocd, aparte de su Application principal.
#
# Va en su propia Application porque `argocd` se despliega desde un chart y el
# `HTTPRoute` no sale de él: es un objeto nuestro. Wave 2 — necesita el Gateway,
# que es wave 1.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-route
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  source:
    repoURL: https://github.com/heiderp/proxmox-tofu-k8s.git
    targetRevision: main
    path: gitops/apps/argocd-route/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
